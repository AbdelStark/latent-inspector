[package]
name = "latent-inspector"
version = "0.1.0"
edition = "2021"
description = "Fast CLI for inspecting and comparing learned representations across self-supervised vision models"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AbdelStark/latent-inspector"

[[bin]]
name = "latent-inspector"
path = "src/main.rs"

[dependencies]
# ONNX Runtime
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }

# Numerics
ndarray = { version = "0.16", features = ["rayon"] }

# Image I/O
image = { version = "0.25", features = ["png", "jpeg"] }

# Parallelism
rayon = "1.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Progress bars
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1"

# Directories
dirs = "6"

# HTTP / download
reqwest = { version = "0.12", features = ["blocking"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Hungarian algorithm for patch correspondence
pathfinding = "4"

[features]
onnx-inference = []

[dev-dependencies]
approx = "0.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
